<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLIPZY Admin</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #09051a;
    color: white;
}

.login {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 420px;
    background: #15102d;
    border: 1px solid #34256b;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 20px 60px #0008;
}

h1 {
    margin-top: 0;
    text-align: center;
}

.subtitle {
    text-align: center;
    color: #aaa;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #40327a;
    background: #0d0920;
    color: white;
    font-size: 16px;
    outline: none;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 15px;
    border: 0;
    border-radius: 10px;
    background: #7047ff;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(.98);
}

#status {
    margin-top: 15px;
    text-align: center;
    min-height: 24px;
    color: #aaa;
}

.dashboard {
    display: none;
    min-height: 100vh;
    padding: 30px;
}

.box {
    max-width: 900px;
    margin: auto;
    background: #15102d;
    border: 1px solid #34256b;
    border-radius: 20px;
    padding: 30px;
}

.logout {
    background: #3a244d;
    max-width: 150px;
}

.success {
    color: #7cff9b !important;
}

.error {
    color: #ff7070 !important;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="loginScreen">

    <div class="card">

        <h1>⚡ CLIPZY ADMIN</h1>

        <div class="subtitle">
            Enter your admin password
        </div>

        <input
            id="password"
            type="password"
            placeholder="Admin password"
            autocomplete="current-password"
        >

        <button onclick="login()">
            LOGIN
        </button>

        <div id="status">
            JavaScript ready
        </div>

    </div>

</div>


<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">

    <div class="box">

        <h1>🔥 CLIPZY DASHBOARD</h1>

        <p>
            You're logged in successfully.
        </p>

        <button class="logout" onclick="logout()">
            Logout
        </button>

    </div>

</div>


<script>

const API_URL =
"https://clipzy-admin-api.suhaanali161.workers.dev";


function showStatus(message, type = "") {

    const status =
        document.getElementById("status");

    status.textContent = message;

    status.className = type;
}


async function login() {

    const password =
        document.getElementById("password").value;

    if (!password) {

        showStatus(
            "Enter your password first.",
            "error"
        );

        return;
    }

    showStatus(
        "Connecting to Cloudflare..."
    );

    try {

        const response = await fetch(
            API_URL,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    action: "login",
                    password: password
                })
            }
        );

        const text =
            await response.text();

        console.log("Worker response:", text);

        let data;

        try {
            data = JSON.parse(text);
        } catch {

            showStatus(
                "Worker returned invalid JSON: " + text,
                "error"
            );

            return;
        }


        if (data.success) {

            sessionStorage.setItem(
                "clipzy_admin_password",
                password
            );

            document.getElementById(
                "loginScreen"
            ).style.display = "none";

            document.getElementById(
                "dashboard"
            ).style.display = "block";

            return;
        }


        showStatus(
            data.error || "Login failed.",
            "error"
        );

    } catch (error) {

        console.error(error);

        showStatus(
            "Connection error: " + error.message,
            "error"
        );
    }
}


function logout() {

    sessionStorage.removeItem(
        "clipzy_admin_password"
    );

    document.getElementById(
        "dashboard"
    ).style.display = "none";

    document.getElementById(
        "loginScreen"
    ).style.display = "flex";

    document.getElementById(
        "password"
    ).value = "";

    showStatus(
        "Logged out."
    );
}


document
    .getElementById("password")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            login();
        }

    });

</script>

</body>
</html>
