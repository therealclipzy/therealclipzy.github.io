<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLIPZY Admin</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #07050d;
    color: white;
    min-height: 100vh;
}

/* LOGIN */

#loginScreen {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at center, #24104b 0%, #07050d 55%);
    z-index: 9999;
}

.loginBox {
    width: 90%;
    max-width: 420px;
    padding: 35px;
    background: rgba(20, 15, 35, .9);
    border: 1px solid #713cff;
    border-radius: 20px;
    box-shadow: 0 0 50px rgba(120, 50, 255, .25);
    text-align: center;
}

.logo {
    font-size: 38px;
    font-weight: 900;
    background: linear-gradient(90deg, #9d5cff, #4db8ff);
    -webkit-background-clip: text;
    color: transparent;
    margin-bottom: 10px;
}

.loginBox p {
    color: #aaa;
    margin-bottom: 25px;
}

input, textarea {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    background: #100c1b;
    color: white;
    border: 1px solid #33254f;
    border-radius: 10px;
    outline: none;
}

input:focus,
textarea:focus {
    border-color: #8b5cff;
}

button {
    border: none;
    border-radius: 10px;
    padding: 13px 20px;
    cursor: pointer;
    color: white;
    font-weight: bold;
    background: linear-gradient(90deg, #713cff, #397cff);
}

.loginButton {
    width: 100%;
    margin-top: 10px;
}

#error {
    color: #ff5555;
    margin-top: 12px;
    display: none;
}

/* DASHBOARD */

#dashboard {
    display: none;
}

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 230px;
    height: 100vh;
    padding: 25px 15px;
    background: #0d0916;
    border-right: 1px solid #251a38;
}

.sidebar h2 {
    text-align: center;
    margin-bottom: 30px;
}

.nav button {
    width: 100%;
    margin: 5px 0;
    text-align: left;
    background: transparent;
    color: #aaa;
}

.nav button:hover {
    background: #1d1430;
    color: white;
}

.main {
    margin-left: 230px;
    padding: 35px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.top h1 {
    font-size: 32px;
}

.logout {
    background: #351526;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
    margin-bottom: 30px;
}

.card {
    padding: 22px;
    background: #110c1d;
    border: 1px solid #2b1d42;
    border-radius: 15px;
}

.card h3 {
    color: #aaa;
    font-size: 14px;
}

.card strong {
    display: block;
    margin-top: 8px;
    font-size: 28px;
}

.panel {
    background: #100b19;
    border: 1px solid #291b3d;
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 20px;
}

.panel h2 {
    margin-bottom: 18px;
}

.save {
    margin-top: 10px;
}

.status {
    margin-top: 12px;
    color: #6cff9b;
}

.section {
    display: none;
}

.section.active {
    display: block;
}

/* MOBILE */

@media(max-width:700px) {

    .sidebar {
        position: relative;
        width: 100%;
        height: auto;
        border-right: none;
        border-bottom: 1px solid #251a38;
    }

    .main {
        margin-left: 0;
        padding: 20px;
    }

    .nav {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
    }

    .top {
        gap: 10px;
        align-items: flex-start;
    }

}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

    <div class="loginBox">

        <div class="logo">CLIPZY</div>

        <h2>Admin Panel</h2>

        <p>Enter the admin password to continue.</p>

        <input
            id="password"
            type="password"
            placeholder="Admin password"
            onkeydown="if(event.key==='Enter') login()"
        >

        <button class="loginButton" onclick="login()">
            LOGIN
        </button>

        <div id="error">
            Incorrect password
        </div>

    </div>

</div>


<!-- DASHBOARD -->

<div id="dashboard">

    <aside class="sidebar">

        <h2>⚡ CLIPZY</h2>

        <div class="nav">

            <button onclick="showSection('dashboardHome')">
                🏠 Dashboard
            </button>

            <button onclick="showSection('homepage')">
                ✏️ Homepage
            </button>

            <button onclick="showSection('projects')">
                🚀 Projects
            </button>

            <button onclick="showSection('links')">
                🔗 Links
            </button>

            <button onclick="showSection('announcements')">
                📢 Announcements
            </button>

        </div>

    </aside>


    <main class="main">

        <div class="top">

            <h1>Admin Dashboard</h1>

            <button class="logout" onclick="logout()">
                Logout
            </button>

        </div>


        <!-- DASHBOARD -->

        <section id="dashboardHome" class="section active">

            <div class="cards">

                <div class="card">
                    <h3>Website</h3>
                    <strong>ONLINE</strong>
                </div>

                <div class="card">
                    <h3>Projects</h3>
                    <strong id="projectCount">0</strong>
                </div>

                <div class="card">
                    <h3>Announcements</h3>
                    <strong id="announcementCount">0</strong>
                </div>

            </div>

            <div class="panel">

                <h2>Welcome back 👋</h2>

                <p>
                    Use the menu to edit your CLIPZY website.
                </p>

            </div>

        </section>


        <!-- HOMEPAGE -->

        <section id="homepage" class="section">

            <div class="panel">

                <h2>Homepage Editor</h2>

                <label>Hero Title</label>

                <input id="heroTitle" value="CLIPZY">

                <label>Description</label>

                <textarea id="heroDescription" rows="5">Gaming, development and content.</textarea>

                <button class="save" onclick="saveHomepage()">
                    Save Homepage
                </button>

                <div id="homeStatus" class="status"></div>

            </div>

        </section>


        <!-- PROJECTS -->

        <section id="projects" class="section">

            <div class="panel">

                <h2>Add Project</h2>

                <input
                    id="projectName"
                    placeholder="Project name"
                >

                <input
                    id="projectDescription"
                    placeholder="Project description"
                >

                <button onclick="addProject()">
                    Add Project
                </button>

                <div id="projectsList"></div>

            </div>

        </section>


        <!-- LINKS -->

        <section id="links" class="section">

            <div class="panel">

                <h2>Social Links</h2>

                <input
                    id="youtube"
                    placeholder="YouTube URL"
                >

                <input
                    id="tiktok"
                    placeholder="TikTok URL"
                >

                <input
                    id="discord"
                    placeholder="Discord URL"
                >

                <button onclick="saveLinks()">
                    Save Links
                </button>

                <div id="linksStatus" class="status"></div>

            </div>

        </section>


        <!-- ANNOUNCEMENTS -->

        <section id="announcements" class="section">

            <div class="panel">

                <h2>Create Announcement</h2>

                <textarea
                    id="announcementText"
                    rows="4"
                    placeholder="Write an announcement..."
                ></textarea>

                <button onclick="addAnnouncement()">
                    Publish Announcement
                </button>

                <div id="announcementList"></div>

            </div>

        </section>

    </main>

</div>


<script>

/* =========================
   PASSWORD
========================= */

const ADMIN_PASSWORD = "tester4ever";


function login() {

    const password =
        document.getElementById("password").value;

    const error =
        document.getElementById("error");

    if (password === ADMIN_PASSWORD) {

        sessionStorage.setItem(
            "clipzyAdmin",
            "true"
        );

        document.getElementById("loginScreen")
            .style.display = "none";

        document.getElementById("dashboard")
            .style.display = "block";

        loadEverything();

    } else {

        error.style.display = "block";

    }
}


function logout() {

    sessionStorage.removeItem("clipzyAdmin");

    location.reload();

}


/* =========================
   NAVIGATION
========================= */

function showSection(id) {

    document
        .querySelectorAll(".section")
        .forEach(section => {

            section.classList.remove("active");

        });

    document
        .getElementById(id)
        .classList.add("active");

}


/* =========================
   HOMEPAGE
========================= */

function saveHomepage() {

    const data = {

        title:
            document.getElementById("heroTitle").value,

        description:
            document.getElementById("heroDescription").value

    };

    localStorage.setItem(
        "clipzyHomepage",
        JSON.stringify(data)
    );

    document.getElementById("homeStatus")
        .textContent = "✓ Homepage saved";

}


/* =========================
   LINKS
========================= */

function saveLinks() {

    const links = {

        youtube:
            document.getElementById("youtube").value,

        tiktok:
            document.getElementById("tiktok").value,

        discord:
            document.getElementById("discord").value

    };

    localStorage.setItem(
        "clipzyLinks",
        JSON.stringify(links)
    );

    document.getElementById("linksStatus")
        .textContent = "✓ Links saved";

}


/* =========================
   PROJECTS
========================= */

function getProjects() {

    return JSON.parse(
        localStorage.getItem("clipzyProjects") || "[]"
    );

}


function addProject() {

    const name =
        document.getElementById("projectName").value;

    const description =
        document.getElementById("projectDescription").value;

    if (!name) return;

    const projects = getProjects();

    projects.push({
        name,
        description
    });

    localStorage.setItem(
        "clipzyProjects",
        JSON.stringify(projects)
    );

    document.getElementById("projectName").value = "";
    document.getElementById("projectDescription").value = "";

    renderProjects();

}


function renderProjects() {

    const projects = getProjects();

    document.getElementById("projectCount")
        .textContent = projects.length;

    const list =
        document.getElementById("projectsList");

    list.innerHTML = "";

    projects.forEach((project, index) => {

        const box = document.createElement("div");

        box.className = "card";

        box.style.marginTop = "15px";

        box.innerHTML = `
            <h3>${escapeHTML(project.name)}</h3>
            <p>${escapeHTML(project.description)}</p>
            <br>
            <button onclick="deleteProject(${index})">
                Delete
            </button>
        `;

        list.appendChild(box);

    });

}


function deleteProject(index) {

    const projects = getProjects();

    projects.splice(index, 1);

    localStorage.setItem(
        "clipzyProjects",
        JSON.stringify(projects)
    );

    renderProjects();

}


/* =========================
   ANNOUNCEMENTS
========================= */

function getAnnouncements() {

    return JSON.parse(
        localStorage.getItem("clipzyAnnouncements") || "[]"
    );

}


function addAnnouncement() {

    const text =
        document.getElementById("announcementText").value;

    if (!text) return;

    const announcements =
        getAnnouncements();

    announcements.unshift({
        text,
        date: new Date().toLocaleString()
    });

    localStorage.setItem(
        "clipzyAnnouncements",
        JSON.stringify(announcements)
    );

    document.getElementById("announcementText").value = "";

    renderAnnouncements();

}


function renderAnnouncements() {

    const announcements =
        getAnnouncements();

    document.getElementById("announcementCount")
        .textContent = announcements.length;

    const list =
        document.getElementById("announcementList");

    list.innerHTML = "";

    announcements.forEach((announcement, index) => {

        const box = document.createElement("div");

        box.className = "card";

        box.style.marginTop = "15px";

        box.innerHTML = `
            <h3>📢 Announcement</h3>
            <p>${escapeHTML(announcement.text)}</p>
            <small>${escapeHTML(announcement.date)}</small>
            <br><br>
            <button onclick="deleteAnnouncement(${index})">
                Delete
            </button>
        `;

        list.appendChild(box);

    });

}


function deleteAnnouncement(index) {

    const announcements =
        getAnnouncements();

    announcements.splice(index, 1);

    localStorage.setItem(
        "clipzyAnnouncements",
        JSON.stringify(announcements)
    );

    renderAnnouncements();

}


/* =========================
   SECURITY HELPER
========================= */

function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* =========================
   LOAD DATA
========================= */

function loadEverything() {

    const homepage =
        JSON.parse(
            localStorage.getItem("clipzyHomepage")
        );

    if (homepage) {

        document.getElementById("heroTitle")
            .value = homepage.title;

        document.getElementById("heroDescription")
            .value = homepage.description;

    }


    const links =
        JSON.parse(
            localStorage.getItem("clipzyLinks")
        );

    if (links) {

        document.getElementById("youtube")
            .value = links.youtube || "";

        document.getElementById("tiktok")
            .value = links.tiktok || "";

        document.getElementById("discord")
            .value = links.discord || "";

    }


    renderProjects();

    renderAnnouncements();

}


/* =========================
   AUTO LOGIN
========================= */

if (
    sessionStorage.getItem("clipzyAdmin")
    === "true"
) {

    document.getElementById("loginScreen")
        .style.display = "none";

    document.getElementById("dashboard")
        .style.display = "block";

    loadEverything();

}

</script>

</body>
</html>
