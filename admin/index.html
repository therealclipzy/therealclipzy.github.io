<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLIPZY Admin</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at top left, #32106b, transparent 45%),
        radial-gradient(circle at bottom right, #101b55, transparent 45%),
        #070712;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
}

.login-box {
    width: min(500px, 90%);
    background: rgba(25, 25, 45, 0.95);
    border: 1px solid #393957;
    border-radius: 25px;
    padding: 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
}

.logo {
    text-align: center;
    font-size: 42px;
    font-weight: 900;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #aaaac0;
    font-size: 20px;
    margin-bottom: 35px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 10px;
}

input {
    width: 100%;
    padding: 17px;
    border-radius: 14px;
    border: 1px solid #40405c;
    background: #202033;
    color: white;
    font-size: 17px;
    outline: none;
}

input:focus {
    border-color: #8b5cff;
}

button {
    width: 100%;
    margin-top: 18px;
    padding: 17px;
    border: 0;
    border-radius: 14px;
    background: linear-gradient(90deg, #7545ff, #ae55ff);
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(.98);
}

#status {
    margin-top: 18px;
    text-align: center;
    min-height: 24px;
    color: #ff8080;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">CLIPZY</div>
    <div class="subtitle">Admin Panel</div>

    <form id="loginForm">

        <label for="password">Admin Password</label>

        <input
            id="password"
            type="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
        >

        <button id="loginButton" type="submit">
            🔐 Login
        </button>

        <div id="status"></div>

    </form>

</div>

<script>

const API_URL = "https://clipzy-admin-api.suhaanali161.workers.dev";

const form = document.getElementById("loginForm");
const passwordInput = document.getElementById("password");
const button = document.getElementById("loginButton");
const status = document.getElementById("status");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const password = passwordInput.value;

    if (!password) {
        status.textContent = "Enter your password.";
        return;
    }

    button.disabled = true;
    button.textContent = "⏳ Checking...";
    status.textContent = "";

    try {

        const response = await fetch(API_URL, {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                action: "login",
                password: password
            })
        });

        const result = await response.json();

        if (result.success) {

            sessionStorage.setItem("clipzy_admin_password", password);

            status.style.color = "#70ff9b";
            status.textContent = "✅ Login successful!";

            setTimeout(() => {
                window.location.href = "./dashboard.html";
            }, 500);

        } else {

            status.style.color = "#ff8080";
            status.textContent = "❌ " + (result.error || "Login failed.");

        }

    } catch (error) {

        console.error(error);

        status.style.color = "#ff8080";
        status.textContent =
            "❌ Cannot connect to the admin server.";

    }

    button.disabled = false;
    button.textContent = "🔐 Login";

});

</script>

</body>
</html>
