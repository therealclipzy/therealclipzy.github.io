<!DOCTYPE html>
<html>
<head>
<title>CLIPZY Admin Test</title>
<style>
body{
    background:#080612;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}
.box{
    background:#151126;
    padding:30px;
    border-radius:20px;
    width:300px;
    text-align:center;
}
input,button{
    width:100%;
    padding:14px;
    margin-top:12px;
    box-sizing:border-box;
    border-radius:10px;
    border:0;
}
button{
    background:#635bff;
    color:white;
    font-weight:bold;
}
#result{
    margin-top:15px;
}
</style>
</head>

<body>

<div class="box">

<h1>⚡ CLIPZY</h1>

<input id="password" type="password" placeholder="Password">

<button type="button" onclick="testLogin()">
Login
</button>

<div id="result"></div>

</div>

<script>
function testLogin(){

    var password = document.getElementById("password").value;
    var result = document.getElementById("result");

    if(password === "tester4ever"){
        result.innerHTML = "✅ JAVASCRIPT WORKS!";
    }else{
        result.innerHTML = "❌ WRONG PASSWORD";
    }

}
</script>

</body>
</html>
