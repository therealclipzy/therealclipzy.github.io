<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLIPZY Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial;background:#05050a;color:#fff;min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#211044,transparent 55%)}.box{width:min(420px,100%);padding:30px;border:1px solid #29223d;border-radius:24px;background:#0c0b13;box-shadow:0 25px 80px #0008}.logo{font-size:28px;font-weight:900;letter-spacing:3px;text-align:center}.logo span{color:#8b5cff}.muted{text-align:center;color:#777;margin:8px 0 24px}label{display:block;font-size:13px;color:#aaa;margin:16px 0 7px}input,textarea{width:100%;background:#08080e;border:1px solid #292936;color:#fff;border-radius:12px;padding:13px;outline:0}textarea{min-height:120px;resize:vertical}input:focus,textarea:focus{border-color:#7950ff}.btn{border:0;border-radius:12px;padding:13px 18px;color:#fff;font-weight:800;background:linear-gradient(135deg,#7950ff,#4e7cff)}.full{width:100%;margin-top:18px}.msg{margin-top:14px;text-align:center;min-height:18px}.app{display:flex;min-height:100vh}.side{width:230px;background:#0a0910;border-right:1px solid #1c1a27;padding:22px;position:fixed;inset:0 auto 0 0}.side .logo{text-align:left;margin-bottom:30px}.nav button{width:100%;text-align:left;border:0;background:transparent;color:#888;padding:13px 12px;border-radius:10px;margin:3px 0}.nav button:hover,.nav button.active{background:#171329;color:#fff}.logout{position:absolute;bottom:22px;left:22px;right:22px}.main{margin-left:230px;width:calc(100% - 230px);padding:35px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}.top h1{font-size:30px}.card{background:#0c0b13;border:1px solid #211f2c;border-radius:20px;padding:24px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.stat{padding:20px;background:#0a0910;border:1px solid #211f2c;border-radius:16px}.stat b{font-size:28px}.stat span{display:block;color:#777;margin-top:6px}.small{color:#777;line-height:1.5}.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
@media(max-width:800px){.app{display:block}.side{position:static;width:100%;height:auto}.main{margin:0;width:100%;padding:20px}.logout{position:static;margin-top:15px}.grid{grid-template-columns:1fr}.nav{display:grid;grid-template-columns:1fr 1fr}}
</style></head><body>
<div id="login" class="login"><div class="box"><div class="logo">CLIP<span>ZY</span></div><p class="muted">Admin Dashboard</p><label>Password</label><input id="password" type="password" placeholder="Enter admin password"><button class="btn full" onclick="login()">Login</button><div id="loginMsg" class="msg"></div></div></div>
<div id="app" class="app hidden"><aside class="side"><div class="logo">CLIP<span>ZY</span></div><div class="nav">
<button class="active" onclick="page('dashboard',this)">📊 Dashboard</button><button onclick="page('home',this)">🏠 Homepage</button><button onclick="page('project',this)">🚀 Project</button><button onclick="page('links',this)">🔗 Links</button><button onclick="page('announcement',this)">📢 Announcement</button></div><button class="nav logout" onclick="logout()">Log out</button></aside>
<main class="main"><div class="top"><h1 id="title">Dashboard</h1><a class="btn" href="https://therealclipzy.github.io/" target="_blank">View Site ↗</a></div>
<section id="dashboard" class="page"><div class="grid"><div class="stat"><b>1</b><span>Homepage</span></div><div class="stat"><b>1</b><span>Project</span></div><div class="stat"><b>4</b><span>Links</span></div></div><div class="card" style="margin-top:18px"><h2>Welcome to CLIPZY Admin</h2><p class="small" style="margin-top:10px">Edit your live GitHub Pages site from here.</p></div></section>
<section id="home" class="page hidden"><div class="card"><h2>Edit Homepage</h2><label>Badge</label><input id="badge" value="⚡ WELCOME TO MY WEBSITE"><label>Title</label><input id="heroTitle" value="CLIPZY"><label>Description</label><textarea id="heroDesc">Gaming. Projects. Content.
Welcome to my corner of the internet.</textarea><div class="actions"><button class="btn" onclick="saveHome()">Save Homepage</button></div><div id="homeMsg" class="msg"></div></div></section>
<section id="project" class="page hidden"><div class="card"><h2>Edit Project</h2><label>Title</label><input id="projectTitle" value="🚀 More Coming Soon"><label>Description</label><textarea id="projectDesc">I'm constantly making new projects, experimenting with code and coming up with new ideas. Check back later to see what's been added.</textarea><div class="actions"><button class="btn" onclick="saveProject()">Save Project</button></div><div id="projectMsg" class="msg"></div></div></section>
<section id="links" class="page hidden"><div class="card"><h2>Edit Links</h2><label>YouTube</label><input id="youtube" placeholder="https://youtube.com/..."><label>Discord</label><input id="discord" placeholder="https://discord.com/..."><label>TikTok</label><input id="tiktok" placeholder="https://tiktok.com/@..."><label>GitHub</label><input id="github" placeholder="https://github.com/..."><div class="actions"><button class="btn" onclick="saveLinks()">Save Links</button></div><div id="linksMsg" class="msg"></div></div></section>
<section id="announcement" class="page hidden"><div class="card"><h2>Publish Announcement</h2><label>Title</label><input id="annTitle" placeholder="New announcement"><label>Text</label><textarea id="annText" placeholder="Write your announcement..."></textarea><div class="actions"><button class="btn" onclick="saveAnnouncement()">Publish Announcement</button></div><div id="annMsg" class="msg"></div></div></section>
</main></div>
<script>
const API_URL="https://clipzy-admin-api.suhaanali161.workers.dev";
async function request(action,data={}){const p=sessionStorage.getItem("clipzy_admin_password");const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,password:p,data})});const x=await r.json().catch(()=>({}));if(!r.ok||!x.ok)throw Error(x.error||"Request failed");return x}
async function login(){const p=document.getElementById("password").value,m=document.getElementById("loginMsg");try{const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"login",password:p,data:{}})});const x=await r.json().catch(()=>({}));if(!r.ok||!x.ok)throw Error(x.error||"Wrong password");sessionStorage.setItem("clipzy_admin_password",p);document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden")}catch(e){m.textContent=e.message}}
function logout(){sessionStorage.removeItem("clipzy_admin_password");location.reload()}
function page(id,b){document.querySelectorAll(".page").forEach(x=>x.classList.add("hidden"));document.getElementById(id).classList.remove("hidden");document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById("title").textContent=b.textContent.replace(/^\S+\s/,"")}
function msg(id,t,ok=true){const e=document.getElementById(id);e.textContent=t;e.style.color=ok?"#7dffb2":"#ff8f8f"}
async function saveHome(){try{await request("homepage",{badge:badge.value,title:heroTitle.value,description:heroDesc.value});msg("homeMsg","Homepage saved ✓")}catch(e){msg("homeMsg",e.message,false)}}
async function saveProject(){try{await request("project",{title:projectTitle.value,description:projectDesc.value});msg("projectMsg","Project saved ✓")}catch(e){msg("projectMsg",e.message,false)}}
async function saveLinks(){try{await request("links",{youtube:youtube.value,discord:discord.value,tiktok:tiktok.value,github:github.value});msg("linksMsg","Links saved ✓")}catch(e){msg("linksMsg",e.message,false)}}
async function saveAnnouncement(){try{await request("announcement",{title:annTitle.value,text:annText.value});msg("annMsg","Announcement published ✓")}catch(e){msg("annMsg",e.message,false)}}
if(sessionStorage.getItem("clipzy_admin_password")){login.style.display="none";app.classList.remove("hidden")}
</script></body></html>
